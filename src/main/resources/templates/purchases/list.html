<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/list.css}">
  <title>Purchase List</title>
</head>

<body>
  <div class="header">
    <h1>グッズ購買紀錄</h1>
    <div class="actions">
      <a href="/purchases/new" class="btn-add">新增購買</a>
      <button id="guideBtn" class="btn-more" title="說明">?</button>
      <div id="menu" class="menu">
        <button id="moreBtn" class="btn-more">⋯</button>
        <div class="dropdown">
          <button id="mergeModeBtn">合併出貨</button>
          <button id="editModeBtn">編輯模式</button>
        </div>
      </div>
    </div>
  </div>
  <div id="mergeBar" class="merge-bar hidden">
    <span id="mergeCount">已選 0 筆</span>
    <button id="clearMergeBtn">重設</button>
    <button id="confirmMergeBtn">確認合併</button>
    <button id="exitMergeBtn">取消</button>
  </div>
  
  <table>
    <thead>
      <tr>
        <th class="id-col">#</th>
        <th class="work-color-col" title="作品">■</th>
        <th>日期</th>
        <th>名稱</th>
        <th>金額</th>
        <th class="extra-col">追加金額</th>
        <th>郵費</th>
        <th>狀態</th>
        <th class="category-col">種類</th>
        <th class="action-col"></th>
      </tr>
    </thead>

    <tbody>
      <tr th:each="p, pStat : ${purchases}"
          th:attr="data-id=${p.id},data-price=${p.totalPrice},
                   data-shipping=${p.order?.shippingFee},
                   data-extra=${extraMap[p.id]?.paidAmount}">
        <td class="id-col" th:text="${p.id}"></td>
        <td class="work-color tooltip" th:data-work-id="${p.work.id}" th:data-color="${p.work.color}"
          th:data-received="${p.received}" th:data-work="${p.work.title}"></td>
        <td class="date-col tooltip" th:text="${pStat.index == 0 or purchases[pStat.index-1].purchaseDate != p.purchaseDate 
                      ? #temporals.format(p.purchaseDate,'yyyy-MM') 
                      : ''}" th:attr="data-date=${#temporals.format(p.purchaseDate,'yyyy-MM')}">
        </td>

        <td class="name-col edit-cell" th:attr="data-note=${p.note}" th:classappend="${!#strings.isEmpty(#strings.trim(p.note))} ? 'has-note'" data-field="itemName">
          <div class="name-wrapper">
            <span class="text" th:text="${p.itemName}"></span>
            <input class="edit-input hidden" type="text"/>
            <button class="note-toggle hidden">新增備註</button>
          </div>
          <textarea class="edit-note hidden" placeholder="備註"></textarea>
        </td>

        <td class="amount" th:attr="data-id=${p.id},data-price=${p.totalPrice.stripTrailingZeros().toPlainString()},
          data-source=${p.paymentSource},data-type=${p.purchaseType}"
          th:text="${p.totalPrice.stripTrailingZeros().toPlainString()}"></td>

        <td class="extra edit-cell" data-field="extra">
          <span class="text" th:text="${extraMap[p.id]?.paidAmount != null ? extraMap[p.id].paidAmount.stripTrailingZeros().toPlainString() : ''}"></span>
          <div class="edit-block hidden">
            <label class="edit-label">金額</label>
            <input class="edit-input" type="number" placeholder="金額"/>
            <label class="edit-label">說明</label>
            <input class="edit-mini-note" type="text" list="extraNotesList" placeholder="說明"/>
          </div>
          <div class="note-text hidden" th:text="${extraMap[p.id]?.note}"></div>
        </td>

        <td class="shipping edit-cell" th:classappend="${!#strings.isEmpty(#strings.trim(p.order?.shippingNote))} ? 'has-note'" data-field="shipping"
            th:attr="data-order=${p.order?.id},
                    data-order-count=${p.order != null ? orderCountMap[p.order.id] : 0},
                    data-no-shipping=${p.order?.noShipping}"><span class="text" th:text="${p.order?.shippingFee != null 
              ? p.order.shippingFee.stripTrailingZeros().toPlainString() : ''}"></span>
          <div class="edit-block hidden">
            <label class="edit-label">郵費</label>
            <input class="edit-input" type="number" placeholder="郵費"/>
            <label class="edit-label">說明</label>
            <input class="edit-mini-note" type="text" placeholder="說明"/>
          </div>
          <div class="note-text hidden" th:text="${p.order?.shippingNote}"></div>
        </td>
        
        <td class="status tooltip"
            th:attr="data-order=${p.order?.id}, data-received=${p.received},
                     data-shipping=${p.order?.shippingFee}, data-color=${p.order?.color}">
          <span class="shippingMark" th:if="${p.received}">✓</span>
        </td>
        <td class="category-col" th:text="${p.category}"></td>
        <td class="action-col">
          <button class="edit-btn hidden">Edit</button>
          <button class="save-btn hidden">Save</button>
          <button class="cancel-btn hidden">Cancel</button>
        </td>
      </tr>

    <tr th:if="${#lists.isEmpty(purchases)}">
      <td colspan="9" class="empty-state">
        <div class="empty-text">尚無購買紀錄</div>
        <div class="empty-tip">請點擊「新增購買」</div>
      </td>
    </tr>
    </tbody>

    <tfoot>
      <tr th:if="${not #lists.isEmpty(purchases)}">
        <td class="total-spacer" colspan="7"></td>
        <td id="total-amount" colspan="2">總計：</td>
      </tr>
    </tfoot>
  </table>

  <script th:src="@{/js/utils/menu.js}" defer></script>
  <script th:src="@{/js/utils/api.js}" defer></script>
  <script th:src="@{/js/utils/ui-utils.js}" defer></script>
  <script th:src="@{/js/features/total.js}" defer></script>
  <script th:src="@{/js/modes/mergeMode.js}" defer></script>
  <script th:src="@{/js/colors/workColor.js}" defer></script>
  <script th:src="@{/js/colors/orderColor.js}" defer></script>
  <script th:src="@{/js/popovers/paymentPopover.js}" defer></script>
  <script th:src="@{/js/popovers/shippingEdit.js}" defer></script>
  <script th:src="@{/js/features/status.js}" defer></script>
  <script th:src="@{/js/modes/editMode.js}" defer></script>
  <script th:src="@{/js/data/operationGuideData.js}" defer></script>
  <script th:src="@{/js/features/operationGuide.js}" defer></script>

  <datalist id="extraNotesList">
    <option th:each="note : ${extraNotes}" th:value="${note}"></option>
  </datalist>

  <div id="guideModal" class="hidden">
    <div class="guide-box">
      <div class="guide-header">
        <h2 id="guideTitle"></h2>
        <div class="guide-lang">
          <button data-lang="zh">中文</button>
          <button data-lang="ja">日本語</button>
        </div>
        <button class="guide-close" id="guideClose">✕</button>
      </div>
      <div id="guideContent"></div>
    </div>
  </div>
</body>
</html>
